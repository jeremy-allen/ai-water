<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Annual US Water Use — Nested Comparison</title>
<style>
  body {
    margin: 0;
    padding: 2rem;
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
  }
  .container {
    max-width: 720px;
    width: 100%;
  }
  svg {
    width: 100%;
    height: auto;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1a1a1a; }
    .title { fill: #e0e0e0; }
    .subtitle { fill: #aaaaaa; }
    .legend-title { fill: #e0e0e0; }
    .legend-sub { fill: #aaaaaa; }
    .leader-line { stroke: #666666; }
    .leader-dot { fill: #666666; }
    .leader-dot-yellow { fill: #C4A600; }
    .gray-box { fill: #3a3a3a; stroke: #666666; }
    .blue-box { fill: #1a3a5c; stroke: #4a8ab0; }
  }
  @media (prefers-color-scheme: light) {
    .title { fill: #1a1a1a; }
    .subtitle { fill: #555555; }
    .legend-title { fill: #1a1a1a; }
    .legend-sub { fill: #555555; }
    .leader-line { stroke: #bbbbbb; stroke-dasharray: 4 3; }
    .leader-dot { fill: #999999; }
    .leader-dot-yellow { fill: #C4A600; }
    .gray-box { fill: #f0efea; stroke: #b4b2a9; }
    .blue-box { fill: #e6f1fb; stroke: #85b7eb; }
  }
</style>
</head>
<body>
<div class="container">
<svg viewBox="0 0 680 920" xmlns="http://www.w3.org/2000/svg">

<text class="title" x="40" y="36" font-family="inherit" font-size="14" font-weight="500">Annual US water use (to scale)</text>
<text class="subtitle" x="40" y="56" font-family="inherit" font-size="12">Nested area is proportional to volume</text>

<!-- Farmland: 100T liters — 620x620 -->
<rect x="30" y="76" width="620" height="620" rx="18" fill="#7AB648" stroke="#4A8A1A" stroke-width="0.5"/>
<text x="50" y="106" font-family="inherit" font-size="14" font-weight="500" fill="#000000">All US irrigated farmland</text>
<text x="50" y="126" font-family="inherit" font-size="12" fill="#000000">~100 trillion liters/year</text>

<!-- Golf courses: 2T liters = 2% of farmland area → 88x88 -->
<rect class="gray-box" x="543" y="599" width="88" height="88" rx="6" stroke-width="0.5"/>

<!-- AI data centers: ~400B liters → 39x39 -->
<rect class="blue-box" x="592" y="648" width="39" height="39" rx="3" stroke-width="0.5"/>

<!-- LLM training: 15B liters → 8x8 -->
<rect x="623" y="679" width="8" height="8" rx="1" fill="#F5D000" stroke="#C4A600" stroke-width="0.4"/>

<!-- Leader lines -->
<circle class="leader-dot" cx="587" cy="643" r="1.5"/>
<line class="leader-line" x1="587" y1="643" x2="430" y2="730" stroke-width="0.5"/>

<circle class="leader-dot" cx="611" cy="667" r="1.5"/>
<line class="leader-line" x1="611" y1="667" x2="430" y2="772" stroke-width="0.5"/>

<circle class="leader-dot-yellow" cx="627" cy="683" r="1"/>
<line class="leader-line" x1="627" y1="683" x2="430" y2="814" stroke-width="0.5"/>

<!-- Legend -->
<rect class="gray-box" x="40" y="724" width="16" height="16" rx="2" stroke-width="0.5"/>
<text class="legend-title" x="66" y="734" font-family="inherit" font-size="14" font-weight="500">US golf courses</text>
<text class="legend-sub" x="66" y="752" font-family="inherit" font-size="12">~2 trillion liters/year</text>

<rect class="blue-box" x="42" y="766" width="12" height="12" rx="2" stroke-width="0.5"/>
<text class="legend-title" x="66" y="776" font-family="inherit" font-size="14" font-weight="500">US AI data centers (all operations)</text>
<text class="legend-sub" x="66" y="794" font-family="inherit" font-size="12">~230–575 billion liters/year (est.)</text>

<rect x="44" y="810" width="8" height="8" rx="1" fill="#F5D000" stroke="#C4A600" stroke-width="0.5"/>
<text class="legend-title" x="66" y="818" font-family="inherit" font-size="14" font-weight="500">~15 US frontier LLM training runs</text>
<text class="legend-sub" x="66" y="836" font-family="inherit" font-size="12">~15 billion liters/year (est.)</text>

<!-- Sources -->
<text class="subtitle" x="40" y="872" font-family="inherit" font-size="12">Sources: USDA 2023 Irrigation Survey; GCSAA golf course water use data;</text>
<text class="subtitle" x="40" y="890" font-family="inherit" font-size="12">Lawrence Berkeley National Lab 2024 data center report;</text>
<text class="subtitle" x="40" y="908" font-family="inherit" font-size="12">de Vries-Gao 2025 (AI water footprint estimates); Epoch AI.</text>

</svg>
</div>
</body>
</html>
